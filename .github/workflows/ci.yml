name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run mutation-check
      - name: Sample tickets that should be ready
        run: npx tsx src/cli.ts tickets/001-monthly-summary.md tickets/003-export-endpoint.md
